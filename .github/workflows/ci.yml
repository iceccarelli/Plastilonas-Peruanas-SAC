name: CI

# POR QUÉ EXISTE ESTE FLUJO.
#
# Un error de frontera entre servidor y cliente —pasar una función como prop a
# un componente 'use client'— pasa limpiamente por `tsc` y por las 400 pruebas,
# y solo aparece en la fase de PRERENDERIZADO de `next build`. Ocurrió: el
# commit se empujó, Vercel intentó construir, falló, y el sitio se quedó
# sirviendo el commit anterior durante cinco minutos mientras el verificador
# de despliegue esperaba algo que nunca iba a llegar.
#
# Vercel ya construye en cada push, pero su fallo se ve en un panel que hay que
# ir a mirar. Este flujo hace lo mismo delante: falla en rojo, en el repositorio,
# con el log al lado, y marca el commit como roto para cualquiera que lo mire.
#
# El build corre DESPUÉS de tipos y pruebas a propósito: son diez segundos
# contra dos minutos, y no tiene sentido compilar 240 páginas para descubrir
# que faltaba un punto y coma.

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Un push nuevo cancela la comprobación del anterior: lo que importa es si
  # la punta de la rama construye, no si construía hace tres commits.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npx tsc --noEmit

      - name: Pruebas
        run: npx vitest run --reporter=dot

      - name: Consistencia de afirmaciones y mapa de consultas
        # Tres cosas que no rompen la compilación y sí erosionan la confianza:
        # una cifra que ya vive en lib/facts.ts escrita a mano en una página,
        # dos páginas compitiendo por el mismo término comercial, y un banco de
        # prompts que dejó de cubrir lo que el sitio decidió contestar.
        # Corre antes del build porque es instantáneo.
        run: npm run seo:all

      - name: Build de producción
        # La única verificación que ve un error de prerenderizado.
        run: npx next build

      - name: Auditar el HTML generado
        # Enlaces rotos, títulos duplicados, páginas sin <h1> ni canónico,
        # JSON-LD con @id colgantes. Nada de eso rompe la compilación y todo
        # eso erosiona exactamente lo que el sitio existe para construir.
        # Corre DESPUÉS del build porque audita su salida, no el código.
        run: npm run auditar

      - name: Conteo de catálogo (anti-contradicción)
        run: npx vitest run test/facts.test.ts --reporter=dot

      - name: Imágenes — ninguna ruta citada sin archivo
        # Corre ANTES del viewport porque es instantáneo y no necesita
        # navegador: si una ruta de imagen no existe, no hace falta arrancar
        # Chromium en 17 dispositivos para saber que la página saldrá rota.
        run: npm run auditar:imagenes

      - name: Viewport en matriz de dispositivos
        # Mide con Chromium el desbordamiento horizontal y los recortes de la
        # cabecera en 17 anchos reales, de 280px a 2560px. Existe porque una
        # barra de once entradas dejó el CTA «Solicitar Cotización» fuera de
        # pantalla en 1280, 1366, 1440, 1536 y 1920 px durante semanas sin que
        # ninguna prueba lo notara: ningún test de unidad mide layout.
        run: |
          npx playwright install --with-deps chromium
          npm run auditar:viewport

      - name: Desplegables de la cabecera
        # Abre los cuatro grupos en los cinco anchos donde se muestra la barra
        # horizontal y comprueba, para cada opción, que se ve, que se alcanza
        # con el puntero, que nada la tapa, que mide 24px y que su destino
        # responde. Existe porque los 48 paneles —los cuatro grupos en los
        # cuatro anchos— se cerraban mientras el puntero viajaba del botón a la
        # primera opción, por doce píxeles de separación que no pertenecían a
        # ningún elemento. Se veía como «el menú desaparece solo» y ninguna
        # prueba lo notaba: ni el HTML ni el layout estaban mal, lo que fallaba
        # era el trayecto.
        run: npm run auditar:navegacion
