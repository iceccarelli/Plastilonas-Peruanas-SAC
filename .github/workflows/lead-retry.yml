name: RFQ — reintentos y vigilancia

# POR QUÉ EXISTE. vercel.json programa el cron de reintentos UNA vez al día
# (el plan Hobby no admite más y rechaza el despliegue si se intenta). Con
# retrocesos de 1, 5 y 15 minutos eso significaba que una entrega fallida
# esperaba hasta 24 h por intento y llegaba a «dead» en seis días.
#
# Este flujo llama al mismo endpoint cada 15 minutos y además es la ALERTA: si
# hay entregas muertas (ok=false) o el endpoint no responde, el trabajo falla y
# GitHub avisa por correo al propietario. No hace nada hasta que existan los
# secretos del repositorio (ver docs/HUMAN-GATES.md §RFQ).

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      probar_alerta:
        description: "Enviar un mensaje de PRUEBA al destino de alertas (ALERT_WEBHOOK_URL)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lead-retry
  cancel-in-progress: false

jobs:
  reintentar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SITE_ORIGIN: ${{ secrets.SITE_ORIGIN }}
    steps:
      - name: Llamar al endpoint de reintentos
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$SITE_ORIGIN" ]; then
            echo "Sin CRON_SECRET/SITE_ORIGIN en los secretos del repositorio: no hay nada que vigilar todavía."
            exit 0
          fi
          code=$(curl -sS -m 90 -o resp.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_ORIGIN%/}/api/cron/lead-deliveries" || echo 000)
          echo "HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::El endpoint de reintentos respondió ${code} (503 = base o CRON_SECRET sin configurar en Vercel)"
            exit 1
          fi
          # Solo contadores, nunca datos de clientes (el endpoint no los devuelve).
          python3 - <<'PY'
          import json, sys
          d = json.load(open("resp.json"))
          print(json.dumps({k: d.get(k) for k in ("ok", "run", "health")}))
          if not d.get("ok"):
              print("::error::Hay entregas RFQ en dead-letter: recuperar desde /staff (reintento manual)")
              sys.exit(1)
          PY

      - name: Estado profundo (migraciones, bucket, latido, integridad, entregas)
        # Segunda opinión: el endpoint de reintentos comprueba el trabajo; este
        # comprueba el SISTEMA. Falla si /api/health?deep=1 devuelve algo distinto de
        # 200 (migración pendiente, bucket público, oferta con huella alterada,
        # cotizaciones sin entregar, latido viejo). Solo se imprimen estados.
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$SITE_ORIGIN" ]; then exit 0; fi
          code=$(curl -sS -m 60 -o deep.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" "${SITE_ORIGIN%/}/api/health?deep=1" || echo 000)
          echo "HTTP ${code}"
          python3 - <<'PY'
          import json
          d = json.load(open("deep.json"))
          print("estado:", d.get("status"))
          for c in d.get("checks", []):
              if c.get("status") == "fail":
                  print("::error::" + c.get("id", "?") + " — " + c.get("detail", ""))
          for i in d.get("integrations", []):
              if i.get("state") == "misconfigured":
                  print("::error::integración mal configurada: " + i.get("id", "?") + " faltan " + ", ".join(i.get("missing", [])))
          PY
          [ "$code" = "200" ]

      - name: Prueba del canal de alertas (solo a demanda)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probar_alerta }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$SITE_ORIGIN" ]; then echo "Faltan los secretos."; exit 1; fi
          code=$(curl -sS -m 30 -o alert.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" "${SITE_ORIGIN%/}/api/ops/alert-test" || echo 000)
          echo "HTTP ${code}"; cat alert.json; echo
          [ "$code" = "200" ]
